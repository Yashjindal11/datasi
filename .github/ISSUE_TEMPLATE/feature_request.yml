name: Feature request
description: A new detector, statistic, input format or report feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which data problem should DataSI find?
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: How could it be detected? What are the assumptions and failure modes?
