name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build UI into the package
        run: npm --prefix web ci && npm --prefix web run build
      - run: python -m build
      - name: Check version matches tag
        run: |
          v=$(python -c "import datasi; print(datasi.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "version $v does not match tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Check wheel ships the UI
        run: python -c "import zipfile, glob; assert any(n.endswith('server/static/index.html') for n in zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist())"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(python scripts/release_notes.py "${GITHUB_REF_NAME#v}")
          gh release create "${GITHUB_REF_NAME}" dist/* --title "DataSI ${GITHUB_REF_NAME}" --notes "$notes"
