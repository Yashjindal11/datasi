[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "datasi"
dynamic = ["version"]
description = "A local-first statistical data intelligence and quality investigation toolkit for Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Yash Jindal" }]
keywords = ["data-quality", "data-profiling", "anomaly-detection", "statistics", "drift", "data-validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
plot = ["matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff==0.16.10",
    "mypy>=1.10",
    "types-PyYAML",
    "build>=1.2",
    "pyarrow>=15",
]

[project.scripts]
datasi = "datasi.cli.main:main"

[project.urls]
Homepage = "https://github.com/Yashjindal11/datasi"
Documentation = "https://github.com/Yashjindal11/datasi/tree/main/docs"
Issues = "https://github.com/Yashjindal11/datasi/issues"

[tool.hatch.version]
path = "src/datasi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/datasi"]
# Built web viewer assets are git-ignored but must ship in wheels when present.
artifacts = ["src/datasi/server/static/**"]

[tool.hatch.build.targets.sdist]
include = ["src/datasi", "tests", "docs", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]
artifacts = ["src/datasi/server/static/**"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["web"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "NPY", "PD002"]
ignore = [
    "E501",   # line length is handled by ruff format
    "S101",   # assert is fine in tests and for internal invariants
    "S311",   # random is used for reproducible synthetic data, not cryptography
    "RUF012", # ClassVar annotations on pydantic models are noisy
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"examples/**" = ["S"]
"benchmarks/**" = ["S"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["datasi"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pandas.*", "scipy.*", "sklearn.*", "pyarrow.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that exercise several subsystems end to end",
    "slow: large-data tests (deselect with -m 'not slow')",
]

[tool.coverage.run]
source = ["datasi"]
branch = true
